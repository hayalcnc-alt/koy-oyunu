<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b1d14">
<title>Köy ve Çiftlik</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="ikon-192.png">
<link rel="apple-touch-icon" href="ikon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Köy ve Çiftlik">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--baslik:"Cinzel",Georgia,serif;--koyu:#2b1d14;--panel:rgba(43,29,20,.92);--altin:#e9b949;--altinK:#b9862a;--krem:#fff3d6;--yesil:#5aa83a;--kirmizi:#c94c3c;--ust:env(safe-area-inset-top,0px);--alt:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#2b1d14;font-family:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--krem);overscroll-behavior:none;touch-action:none}
#sahne{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
svg{width:20px;height:20px;flex:0 0 auto;display:inline-block;vertical-align:middle}

/* üst çubuk */
#ust{position:fixed;left:0;right:0;top:0;padding:calc(var(--ust) + 8px) 8px 0;display:flex;gap:6px;align-items:flex-start;pointer-events:none;z-index:5}
#kaynaklar{display:flex;gap:5px;flex:1;flex-wrap:wrap;pointer-events:auto}
.kp{display:flex;align-items:center;gap:5px;background:var(--panel);border:2px solid #5a3d24;border-radius:14px;padding:4px 9px 4px 6px;box-shadow:0 3px 0 rgba(0,0,0,.25);min-width:0;transition:transform .2s}
.kp svg{width:22px;height:22px}
.kp div{display:flex;flex-direction:column;line-height:1}
.kp b{font-size:15px;font-weight:700;letter-spacing:.2px}
.kp small{font-size:9.5px;color:#b9f6ca;margin-top:2px;min-height:10px;font-weight:600}
.kp small.eksi{color:#ff9e8a}
.kp.uyari{border-color:#ff6b5a;animation:nab 1s infinite}
.kp.gizli,.kp.gizli2{display:none}
@keyframes nab{50%{transform:scale(1.07)}}
#kurBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);background:#5aa83a;color:#fff;font:800 15px "Alegreya Sans",sans-serif;padding:9px 16px;border-radius:16px;border:2px solid #2f6b1c;box-shadow:0 3px 0 rgba(0,0,0,.3);z-index:6}
#adaBtn{pointer-events:auto;width:42px;height:42px;border-radius:14px;border:2px solid #2d5b7a;background:rgba(24,58,84,.92);color:var(--krem);font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.25);flex:0 0 auto}
body.ziyaret #kaynaklar,body.ziyaret #ayarBtn,body.ziyaret #altBar,body.ziyaret #mutluCip,body.ziyaret #kurBtn{display:none!important}
#ziyaretBant{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;gap:10px;align-items:center;background:rgba(24,58,84,.95);border:2px solid #7fb4d8;color:#fff3d6;padding:8px 10px 8px 14px;border-radius:18px;z-index:7;font-size:15px;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.deniz{position:relative;height:300px;margin:6px -4px 4px;border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#4aa3d8 0%,#2a78b4 55%,#1d5a8c 100%);box-shadow:inset 0 0 30px rgba(0,0,0,.35)}
.deniz .dalga{position:absolute;color:rgba(255,255,255,.35);font-size:20px;animation:dalga 6s ease-in-out infinite}
.deniz .d1{left:12%;top:18%}.deniz .d2{right:10%;bottom:14%;animation-delay:-3s}
@keyframes dalga{50%{transform:translateX(14px)}}
.ada{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;color:#fff;font-family:inherit;cursor:pointer}
.ada .kara{display:block;border-radius:48% 52% 45% 55%/55% 45% 55% 45%;background:radial-gradient(circle at 45% 40%,#7fbf4a 0%,#4f8f2c 55%,#d9c48a 56%,#e8d7a4 70%);box-shadow:0 0 0 3px rgba(255,255,255,.25),0 4px 6px rgba(0,0,0,.3)}
.ada.ben .kara{box-shadow:0 0 0 3px #e9b949,0 4px 6px rgba(0,0,0,.3)}
.ada b{font-size:12px;margin-top:3px;text-shadow:0 1px 2px #000,0 0 4px #000;max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ada small{font-size:10px;opacity:.85;text-shadow:0 1px 2px #000}
.ada .cevrim{display:inline-block;width:9px;height:9px;border-radius:50%;background:#3ddc5a;border:2px solid #fff;margin-right:3px;vertical-align:1px}
.adaBilgi{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}.adaBilgi span{background:rgba(0,0,0,.06);border-radius:10px;padding:7px 8px;font-weight:700;font-size:14px}
.davetKod{font:800 34px/1.2 "Cinzel",Georgia,serif;letter-spacing:6px;text-align:center;background:#fffaf0;color:#3b2414;border:2px dashed #b9862a;border-radius:12px;padding:8px;margin:6px 0;user-select:text;-webkit-user-select:text}
.cvGiris{width:100%;font-size:24px;letter-spacing:5px;text-transform:uppercase;text-align:center;padding:10px;border-radius:10px;border:2px solid #8a6a3a;background:#fffaf0;color:#3b2414;box-sizing:border-box;-webkit-user-select:text;user-select:text}
.gemiForm{display:flex;flex-direction:column;gap:8px}.gemiForm label{display:flex;flex-direction:column;font-weight:700;font-size:14px;gap:3px}.gemiForm small{font-weight:500;opacity:.8}
.gemiForm select,.gemiForm input{font-size:17px;padding:8px;border-radius:10px;border:2px solid #8a6a3a;background:#fffaf0;color:#3b2414;-webkit-user-select:text;user-select:text}
.ada img{display:block;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.ada.ben img{filter:drop-shadow(0 0 3px #ffd75a) drop-shadow(0 0 2px #ffd75a)}
#adaBtn{position:relative}#adaBtn.rozet::after{content:'';position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:#e8443a;border:2px solid #fff}
.pano{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin:6px 0;padding:2px;-webkit-user-select:text;user-select:text;touch-action:pan-y}
.msj{background:#fffaf0;border:1px solid #d9c49a;border-radius:12px 12px 12px 3px;padding:6px 9px;align-self:flex-start;max-width:88%}
.msj.ben{background:#e6f4d8;border-color:#a9cf88;border-radius:12px 12px 3px 12px;align-self:flex-end}
.msj b{font-size:13px;color:#6b3f17}.msj small{font-size:11px;opacity:.6;margin-left:6px}.msj p{margin:2px 0 0;font-size:15px;line-height:1.25}
.hazirMsj{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0}.hazirMsj button{border:1px solid #b9862a;background:#fff3d6;color:#4a3218;border-radius:14px;padding:5px 9px;font:600 13px inherit;font-family:inherit}
.msjGiris{width:100%;font-size:16px;padding:9px;border-radius:10px;border:2px solid #8a6a3a;background:#fffaf0;color:#3b2414;box-sizing:border-box;-webkit-user-select:text;user-select:text}
.gSatir{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px;align-items:center;margin:6px 0;font-weight:700;font-size:14px}
.gCubuk{height:12px;background:#e3d2ad;border-radius:7px;overflow:hidden;border:1px solid #b9862a}.gCubuk i{display:block;height:100%;background:linear-gradient(#7bc95a,#4f9a34)}
.gSatir button{border:0;background:#5aa83a;color:#fff;border-radius:10px;padding:5px 9px;font:700 13px inherit;font-family:inherit}.gSatir em{color:#3c8a25;font-style:normal;font-size:18px}
.gBaslik{margin:8px 0 2px;font-size:15px}.gListe{margin:0;padding-left:4px;list-style:none;max-height:130px;overflow-y:auto;touch-action:pan-y}.gListe li{padding:2px 0;font-weight:600}.gListe small{opacity:.7;font-weight:500}
#pIcerik p.uyari{color:#b3261e;font-weight:800;font-size:16px}
.ekimSec2{display:flex;gap:6px;margin:4px 0 8px}.ekimSec2 button{flex:1;border:2px solid #8a6a3a;background:#fff3d6;color:#4a3218;border-radius:12px;padding:8px 4px;font:700 14px inherit;font-family:inherit}.ekimSec2 button.on{background:#5aa83a;border-color:#2f6b1c;color:#fff}
#sohbetBtn{pointer-events:auto;touch-action:manipulation;position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 132px);width:44px;height:44px;border-radius:50%;border:2px solid #2d5b7a;background:rgba(24,58,84,.92);font-size:22px;z-index:4;display:none;box-shadow:0 3px 0 rgba(0,0,0,.25)}
#sohbetBtn.goster{display:block}#sohbetBtn.rozet::after{content:"";position:absolute;top:-2px;right:-2px;width:13px;height:13px;border-radius:50%;background:#e8443a;border:2px solid #fff}
body.ziyaret #sohbetBtn{display:none!important}
.koyKod{font:800 20px "Cinzel",Georgia,serif;letter-spacing:2px;background:#fffaf0;border:2px dashed #b9862a;border-radius:8px;padding:2px 8px;user-select:text;-webkit-user-select:text}
#ortalaBtn{pointer-events:auto;touch-action:manipulation;position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 184px);width:44px;height:44px;border-radius:50%;border:2px solid #6b4a2a;background:rgba(43,29,20,.88);font-size:21px;z-index:4;box-shadow:0 3px 0 rgba(0,0,0,.25)}
body.ziyaret #ortalaBtn{top:calc(env(safe-area-inset-top,0px) + 132px)}
.dayiSec{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:14px;margin:6px 0}.dayiSec select{font-size:16px;padding:7px;border-radius:10px;border:2px solid #8a6a3a;background:#fffaf0;color:#3b2414}
#rehber{position:fixed;left:10px;right:70px;bottom:calc(var(--alt) + 108px);max-width:330px;background:linear-gradient(#fffaf0,#f6e6bf);color:#4a3218;border:2px solid #b9862a;border-radius:16px;padding:9px 30px 8px 10px;z-index:6;box-shadow:0 4px 0 rgba(0,0,0,.2);font-size:13.5px;line-height:1.3;opacity:0;transform:translateY(12px) scale(.96);pointer-events:none;transition:opacity .25s,transform .25s}
#rehber.on{opacity:1;transform:none;pointer-events:auto}
#rehber::after{content:"";position:absolute;left:34px;bottom:-9px;width:14px;height:14px;background:#f6e6bf;border-right:2px solid #b9862a;border-bottom:2px solid #b9862a;transform:rotate(45deg)}
#rehber.zip{animation:rZip .45s}@keyframes rZip{40%{transform:scale(1.05)}}
#rehber .rUst{display:flex;gap:7px;align-items:flex-start;font-weight:600}#rIk{font-size:20px;line-height:1}
#rehber .rAlt{display:flex;align-items:center;gap:8px;margin-top:6px}#rXp{font-size:11.5px;opacity:.75;flex:1}
#rDug{background:#3f8a3a;color:#fff;border:0;border-radius:10px;padding:6px 12px;font-weight:700;font-size:13px;box-shadow:0 2px 0 #24561f;touch-action:manipulation}
#rKapat{position:absolute;right:4px;top:3px;border:0;background:none;color:#8a6a3a;font-size:15px;width:26px;height:26px}
.kasabaNot{scroll-snap-align:start;flex:0 0 210px;align-self:stretch;background:#fff6dd;border:2px dashed #b9862a;border-radius:14px;padding:10px;color:#4a3218;font-size:13px;line-height:1.45;text-align:left;white-space:normal}.kasabaNot small{opacity:.75}
#mutluCip{pointer-events:auto;position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 96px);background:rgba(30,22,16,.75);color:#ffe9c0;font:700 13px 'Alegreya Sans',sans-serif;padding:4px 9px;border-radius:12px;border:0;z-index:4}
#saatCip{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 62px);background:rgba(30,22,16,.75);color:#ffe9c0;font:700 13px 'Alegreya Sans',sans-serif;padding:4px 9px;border-radius:12px;pointer-events:none;z-index:4}
#ayarBtn{pointer-events:auto;width:42px;height:42px;border-radius:14px;border:2px solid #5a3d24;background:var(--panel);color:var(--krem);font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.25);flex:0 0 auto}

/* görev */
#gorev{position:fixed;left:8px;top:calc(var(--ust) + 100px);max-width:min(300px,72vw);background:linear-gradient(#fff6dd,#f3e1b5);color:#4a3218;border:2px solid #b9862a;border-radius:14px;padding:8px 10px 8px 10px;box-shadow:0 4px 0 rgba(0,0,0,.2);z-index:4;transition:transform .3s,opacity .3s}
#gorev .ust{display:flex;align-items:center;gap:6px}
#gNo{background:#b9862a;color:#fff;border-radius:8px;padding:1px 6px;font-size:11px;font-weight:700}
#gBaslik{font-family:var(--baslik);font-weight:700;font-size:14px;line-height:1.15}
#gMetin{font-size:11.5px;margin-top:3px;opacity:.85;line-height:1.25}
#gAlt{display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:11.5px;font-weight:600;gap:8px}
#gOdul .m svg{width:15px;height:15px}
#gIlerleme{color:#2f7d45}
#gorev.parla{animation:parla .9s}
@keyframes parla{30%{transform:scale(1.08);box-shadow:0 0 0 6px rgba(233,185,73,.6)}}
#gorev.kucuk #gMetin,#gorev.kucuk #gAlt{display:none}
#gorev.kucuk{padding:6px 10px}
#gorev .ok{margin-left:auto;font-size:11px;opacity:.6;transition:transform .2s}
#gorev.kucuk .ok{transform:rotate(180deg)}
body.yerlestirme #gorev,body.panel #gorev,body.cekmece #gorev{opacity:0;pointer-events:none;transform:translateX(-20px)}

/* inşa düğmesi */
#insaBtn{position:fixed;left:50%;bottom:calc(var(--alt) + 14px);transform:translateX(-50%);width:76px;height:76px;border-radius:50%;border:3px solid #e9d9b4;background:radial-gradient(circle at 35% 30%,#d9b067,#a87a35 55%,#6e4a1c);box-shadow:0 5px 0 #4a3010,0 10px 20px rgba(0,0,0,.4);z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#2b1d14;font-family:var(--baslik);font-weight:700;font-size:11px;transition:transform .15s}
#insaBtn:active{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 #7a4a10}
#insaBtn svg{width:34px;height:34px}
body.yerlestirme #insaBtn,body.panel #insaBtn,body.cekmece #insaBtn{transform:translateX(-50%) scale(0);pointer-events:none}

/* çekmece */
#cekmece{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:3px solid var(--altinK);border-radius:20px 20px 0 0;padding:10px 0 calc(var(--alt) + 12px);z-index:7;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1.1);box-shadow:0 -8px 24px rgba(0,0,0,.3)}
body.cekmece #cekmece{transform:none}
#cekmece .bas{display:flex;justify-content:space-between;align-items:center;padding:0 14px 8px}
#cekmece h3{font-family:var(--baslik);margin:0;font-size:18px;color:var(--altin)}
.xBtn{width:36px;height:36px;border-radius:12px;border:0;background:#5a3d24;color:var(--krem);font-size:18px;font-family:inherit}
#katlar{display:flex;gap:6px;overflow-x:auto;padding:0 14px 8px;scrollbar-width:none}
#katlar::-webkit-scrollbar{display:none}
.kat{flex:0 0 auto;background:rgba(255,243,214,.12);color:#f3e2bd;border:1.5px solid rgba(243,226,189,.35);border-radius:16px;padding:6px 11px;font:700 13px 'Alegreya Sans',sans-serif}
.kat.on{background:linear-gradient(#f2c35a,#d9973a);color:#3b2414;border-color:#ffe2a0}
#kartlar{display:flex;gap:10px;overflow-x:auto;padding:4px 14px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
#kartlar::-webkit-scrollbar{display:none}
.kart{flex:0 0 112px;scroll-snap-align:start;background:linear-gradient(#f6ecd4,#e2cfa4);border:2px solid #8a6a3a;border-radius:10px;padding:6px 6px 8px;color:#4a3218;font-family:inherit;text-align:center;box-shadow:0 4px 0 #8a5f1c;transition:transform .1s}
.kart:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5f1c}
.kart .kr{height:86px;border-radius:8px;background:radial-gradient(circle at 50% 55%,#e8ecdf,#b9c4a6);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.kart img{width:100%;height:100%;object-fit:contain}
.kart .kl{position:absolute;inset:0;background:rgba(40,28,18,.55);display:flex;align-items:center;justify-content:center;font-size:28px}
.kart .ka{font-family:var(--baslik);font-weight:700;font-size:11.5px;margin-top:5px;line-height:1.1;min-height:15px}
.kart .km{font-size:11px;margin-top:3px;display:flex;flex-wrap:wrap;gap:2px 6px;justify-content:center;font-weight:600;min-height:16px}
.kart.kilit{filter:grayscale(.7)}
.kart.yok .kr{opacity:.55}
.m{display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.m svg{width:15px;height:15px}
.m.az{color:#c4321f}

/* yerleştirme çubuğu */
#yBar{position:fixed;left:8px;right:8px;bottom:calc(var(--alt) + 10px);background:var(--panel);border:2px solid var(--altinK);border-radius:20px;padding:10px;z-index:7;transform:translateY(130%);transition:transform .25s;box-shadow:0 6px 20px rgba(0,0,0,.35)}
body.yerlestirme #yBar{transform:none}
#yBar .bilgi{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
#yAd{font-family:var(--baslik);font-weight:700;font-size:16px;color:var(--altin)}
#yMal{display:flex;gap:8px;font-size:13px;font-weight:600}
#yNot{font-size:12px;opacity:.9;margin-bottom:8px;min-height:15px}
.dg{display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:14px;padding:12px 6px;font-family:inherit;font-weight:700;font-size:16px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn:disabled{opacity:.45;filter:grayscale(.6)}
.yesil{background:var(--yesil)}.kirmizi{background:var(--kirmizi)}.gri{background:#6d5a48}.altin{background:linear-gradient(#f2c757,#d99a2b);color:#3d2508}
#yIptal,#yDon{flex:0 0 58px;font-size:22px}

/* bina paneli */
#panel{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(#fff6dd,#f3e1b5);color:#4a3218;border-top:3px solid var(--altinK);border-radius:20px 20px 0 0;padding:14px 16px calc(var(--alt) + 14px);z-index:7;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1.1);box-shadow:0 -8px 24px rgba(0,0,0,.3);max-height:62vh;overflow-y:auto}
body.panel #panel{transform:none}
#panel .bas{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#pBaslik{font-family:var(--baslik);margin:0;font-size:20px}
.sv{color:#e39b1a;font-size:16px;letter-spacing:1px;margin-left:4px}.sv i{color:#d8c8a0;font-style:normal}
#pAcik{font-size:13px;margin:4px 0 8px;opacity:.85}
#pIcerik p{margin:6px 0;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#pIcerik p.ac{opacity:.75;font-size:12.5px}
.bonus{background:#cfe8b5;color:#2f6a1f;border-radius:8px;padding:1px 7px;font-size:11.5px;font-weight:600}
.kotu{color:#c4321f;font-weight:600;font-size:12.5px}
.ilr{height:14px;border-radius:8px;background:#d9c49a;overflow:hidden;border:2px solid #b9862a;margin-top:6px}
.ilr div{height:100%;background:linear-gradient(90deg,#7cc243,#5aa83a);transition:width .25s}
#panel .xBtn{background:#d9c49a;color:#4a3218}
#panel .dg{margin-top:12px}
#pYuk .mm{display:flex;gap:6px;font-size:12px;width:100%;justify-content:center}
#pYuk .m.az{color:#ffd1c9}
#pYik{flex:0 0 76px}
#pTasi{flex:0 0 86px}

/* modal */
#modal{position:fixed;inset:0;background:rgba(20,12,6,.55);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
body.modal #modal{opacity:1;pointer-events:auto}
