<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b1d14">
<title>Köy Kurma — Ortaçağ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--baslik:"Cinzel",Georgia,serif;--koyu:#2b1d14;--panel:rgba(43,29,20,.92);--altin:#e9b949;--altinK:#b9862a;--krem:#fff3d6;--yesil:#5aa83a;--kirmizi:#c94c3c;--ust:env(safe-area-inset-top,0px);--alt:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#2b1d14;font-family:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--krem);overscroll-behavior:none;touch-action:none}
#sahne{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
svg{width:20px;height:20px;flex:0 0 auto;display:inline-block;vertical-align:middle}

/* üst çubuk */
#ust{position:fixed;left:0;right:0;top:0;padding:calc(var(--ust) + 8px) 8px 0;display:flex;gap:6px;align-items:flex-start;pointer-events:none;z-index:5}
#kaynaklar{display:flex;gap:5px;flex:1;flex-wrap:wrap;pointer-events:auto}
.kp{display:flex;align-items:center;gap:5px;background:var(--panel);border:2px solid #5a3d24;border-radius:14px;padding:4px 9px 4px 6px;box-shadow:0 3px 0 rgba(0,0,0,.25);min-width:0;transition:transform .2s}
.kp svg{width:22px;height:22px}
.kp div{display:flex;flex-direction:column;line-height:1}
.kp b{font-size:15px;font-weight:700;letter-spacing:.2px}
.kp small{font-size:9.5px;color:#b9f6ca;margin-top:2px;min-height:10px;font-weight:600}
.kp small.eksi{color:#ff9e8a}
.kp.uyari{border-color:#ff6b5a;animation:nab 1s infinite}
.kp.gizli,.kp.gizli2{display:none}
@keyframes nab{50%{transform:scale(1.07)}}
#ayarBtn{pointer-events:auto;width:42px;height:42px;border-radius:14px;border:2px solid #5a3d24;background:var(--panel);color:var(--krem);font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.25);flex:0 0 auto}

/* görev */
#gorev{position:fixed;left:8px;top:calc(var(--ust) + 100px);max-width:min(300px,72vw);background:linear-gradient(#fff6dd,#f3e1b5);color:#4a3218;border:2px solid #b9862a;border-radius:14px;padding:8px 10px 8px 10px;box-shadow:0 4px 0 rgba(0,0,0,.2);z-index:4;transition:transform .3s,opacity .3s}
#gorev .ust{display:flex;align-items:center;gap:6px}
#gNo{background:#b9862a;color:#fff;border-radius:8px;padding:1px 6px;font-size:11px;font-weight:700}
#gBaslik{font-family:var(--baslik);font-weight:700;font-size:14px;line-height:1.15}
#gMetin{font-size:11.5px;margin-top:3px;opacity:.85;line-height:1.25}
#gAlt{display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:11.5px;font-weight:600;gap:8px}
#gOdul .m svg{width:15px;height:15px}
#gIlerleme{color:#2f7d45}
#gorev.parla{animation:parla .9s}
@keyframes parla{30%{transform:scale(1.08);box-shadow:0 0 0 6px rgba(233,185,73,.6)}}
#gorev.kucuk #gMetin,#gorev.kucuk #gAlt{display:none}
#gorev.kucuk{padding:6px 10px}
#gorev .ok{margin-left:auto;font-size:11px;opacity:.6;transition:transform .2s}
#gorev.kucuk .ok{transform:rotate(180deg)}
body.yerlestirme #gorev,body.panel #gorev,body.cekmece #gorev{opacity:0;pointer-events:none;transform:translateX(-20px)}

/* inşa düğmesi */
#insaBtn{position:fixed;left:50%;bottom:calc(var(--alt) + 14px);transform:translateX(-50%);width:76px;height:76px;border-radius:50%;border:3px solid #e9d9b4;background:radial-gradient(circle at 35% 30%,#d9b067,#a87a35 55%,#6e4a1c);box-shadow:0 5px 0 #4a3010,0 10px 20px rgba(0,0,0,.4);z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#2b1d14;font-family:var(--baslik);font-weight:700;font-size:11px;transition:transform .15s}
#insaBtn:active{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 #7a4a10}
#insaBtn svg{width:34px;height:34px}
body.yerlestirme #insaBtn,body.panel #insaBtn,body.cekmece #insaBtn{transform:translateX(-50%) scale(0);pointer-events:none}

/* çekmece */
#cekmece{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:3px solid var(--altinK);border-radius:20px 20px 0 0;padding:10px 0 calc(var(--alt) + 12px);z-index:7;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1.1);box-shadow:0 -8px 24px rgba(0,0,0,.3)}
body.cekmece #cekmece{transform:none}
#cekmece .bas{display:flex;justify-content:space-between;align-items:center;padding:0 14px 8px}
#cekmece h3{font-family:var(--baslik);margin:0;font-size:18px;color:var(--altin)}
.xBtn{width:36px;height:36px;border-radius:12px;border:0;background:#5a3d24;color:var(--krem);font-size:18px;font-family:inherit}
#kartlar{display:flex;gap:10px;overflow-x:auto;padding:4px 14px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
#kartlar::-webkit-scrollbar{display:none}
.kart{flex:0 0 112px;scroll-snap-align:start;background:linear-gradient(#f6ecd4,#e2cfa4);border:2px solid #8a6a3a;border-radius:10px;padding:6px 6px 8px;color:#4a3218;font-family:inherit;text-align:center;box-shadow:0 4px 0 #8a5f1c;transition:transform .1s}
.kart:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5f1c}
.kart .kr{height:86px;border-radius:8px;background:radial-gradient(circle at 50% 55%,#e8ecdf,#b9c4a6);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.kart img{width:100%;height:100%;object-fit:contain}
.kart .kl{position:absolute;inset:0;background:rgba(40,28,18,.55);display:flex;align-items:center;justify-content:center;font-size:28px}
.kart .ka{font-family:var(--baslik);font-weight:700;font-size:11.5px;margin-top:5px;line-height:1.1;min-height:15px}
.kart .km{font-size:11px;margin-top:3px;display:flex;flex-wrap:wrap;gap:2px 6px;justify-content:center;font-weight:600;min-height:16px}
.kart.kilit{filter:grayscale(.7)}
.kart.yok .kr{opacity:.55}
.m{display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.m svg{width:15px;height:15px}
.m.az{color:#c4321f}

/* yerleştirme çubuğu */
#yBar{position:fixed;left:8px;right:8px;bottom:calc(var(--alt) + 10px);background:var(--panel);border:2px solid var(--altinK);border-radius:20px;padding:10px;z-index:7;transform:translateY(130%);transition:transform .25s;box-shadow:0 6px 20px rgba(0,0,0,.35)}
body.yerlestirme #yBar{transform:none}
#yBar .bilgi{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
#yAd{font-family:var(--baslik);font-weight:700;font-size:16px;color:var(--altin)}
#yMal{display:flex;gap:8px;font-size:13px;font-weight:600}
#yNot{font-size:12px;opacity:.9;margin-bottom:8px;min-height:15px}
.dg{display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:14px;padding:12px 6px;font-family:inherit;font-weight:700;font-size:16px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn:disabled{opacity:.45;filter:grayscale(.6)}
.yesil{background:var(--yesil)}.kirmizi{background:var(--kirmizi)}.gri{background:#6d5a48}.altin{background:linear-gradient(#f2c757,#d99a2b);color:#3d2508}
#yIptal,#yDon{flex:0 0 58px;font-size:22px}

/* bina paneli */
#panel{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(#fff6dd,#f3e1b5);color:#4a3218;border-top:3px solid var(--altinK);border-radius:20px 20px 0 0;padding:14px 16px calc(var(--alt) + 14px);z-index:7;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1.1);box-shadow:0 -8px 24px rgba(0,0,0,.3);max-height:62vh;overflow-y:auto}
body.panel #panel{transform:none}
#panel .bas{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#pBaslik{font-family:var(--baslik);margin:0;font-size:20px}
.sv{color:#e39b1a;font-size:16px;letter-spacing:1px;margin-left:4px}.sv i{color:#d8c8a0;font-style:normal}
#pAcik{font-size:13px;margin:4px 0 8px;opacity:.85}
#pIcerik p{margin:6px 0;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#pIcerik p.ac{opacity:.75;font-size:12.5px}
.bonus{background:#cfe8b5;color:#2f6a1f;border-radius:8px;padding:1px 7px;font-size:11.5px;font-weight:600}
.kotu{color:#c4321f;font-weight:600;font-size:12.5px}
.ilr{height:14px;border-radius:8px;background:#d9c49a;overflow:hidden;border:2px solid #b9862a;margin-top:6px}
.ilr div{height:100%;background:linear-gradient(90deg,#7cc243,#5aa83a);transition:width .25s}
#panel .xBtn{background:#d9c49a;color:#4a3218}
#panel .dg{margin-top:12px}
#pYuk .mm{display:flex;gap:6px;font-size:12px;width:100%;justify-content:center}
#pYuk .m.az{color:#ffd1c9}
#pYik{flex:0 0 90px}

/* modal */
#modal{position:fixed;inset:0;background:rgba(20,12,6,.55);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
body.modal #modal{opacity:1;pointer-events:auto}
#mKutu{background:linear-gradient(#fff6dd,#f3e1b5);color:#4a3218;border:3px solid var(--altinK);border-radius:22px;padding:18px;width:min(380px,100%);box-shadow:0 10px 30px rgba(0,0,0,.4);transform:scale(.9);transition:transform .2s}
body.modal #mKutu{transform:none}
#mKutu h2{font-family:var(--baslik);margin:0 0 8px;font-size:21px;text-align:center}
#mKutu p{font-size:14px;margin:6px 0;line-height:1.35}
#mButon{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.kupa{font-size:56px;text-align:center}
.kazanc{display:flex;gap:12px;justify-content:center;font-size:18px;font-weight:700;flex-wrap:wrap}
.kazanc svg{width:22px;height:22px}
.nasil p{font-size:13px!important}

/* bildirim ve etiketler */
#toast{position:fixed;left:50%;top:calc(var(--ust) + 64px);transform:translate(-50%,-10px);background:rgba(43,29,20,.95);border:2px solid var(--altinK);color:var(--krem);padding:9px 16px;border-radius:16px;font-size:14px;font-weight:600;opacity:0;transition:all .25s;pointer-events:none;z-index:25;text-align:center;max-width:92vw;width:max-content}
#toast.on{opacity:1;transform:translate(-50%,0)}
#etiketler{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.uc{position:absolute;left:0;top:0;font-weight:700;font-size:16px;color:#fff;text-shadow:0 2px 0 #3b2414,0 0 4px #3b2414;white-space:nowrap}
.uc.iyi{color:#ffe082;font-size:15px}
.cubuk{position:absolute;left:0;top:0;width:54px;height:10px;border-radius:6px;background:rgba(43,29,20,.85);border:2px solid #fff3d6;overflow:hidden}
.cubuk div{height:100%;background:linear-gradient(90deg,#ffd76a,#e9a52a);width:0}

/* yükleniyor */
#yukleniyor{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#5a4330,#2b1d14);color:#e9d9b4;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#2b1d14;transition:opacity .6s}
#yukleniyor.bitti{opacity:0;pointer-events:none}
#yukleniyor h1{font-family:var(--baslik);font-size:32px;margin:0;color:#fff3d6;text-shadow:0 3px 8px rgba(0,0,0,.6)}
#yukleniyor p{font-weight:700;letter-spacing:.5px}
#hata{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#2b1d14;color:#fff3d6;padding:30px;text-align:center;z-index:60;font-size:15px}

/* ---------- çiftlik ekleri ---------- */
.kp.seviye{padding:4px 8px 4px 4px;gap:6px}
.rozet{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe08a,#d9a02a);color:#3d2508;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;border:2px solid #fff3d6}
.xpbar{width:58px;height:7px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:3px}
.xpbar div{height:100%;background:linear-gradient(90deg,#ffd76a,#ffb02e);width:0;transition:width .3s}
.kp.seviye b{font-size:11px;font-family:var(--baslik)}
.em{font-style:normal;font-size:17px;line-height:1;display:inline-block}
.m .em{font-size:14px}
#altBar{position:fixed;left:0;right:0;bottom:calc(var(--alt) + 12px);display:flex;justify-content:center;align-items:flex-end;gap:22px;z-index:6;pointer-events:none}
#altBar>button{pointer-events:auto}
.yanBtn{width:58px;height:58px;border-radius:50%;border:3px solid #e9d9b4;background:radial-gradient(circle at 35% 30%,#7a5a3a,#4a321e);box-shadow:0 4px 0 #24160c,0 8px 16px rgba(0,0,0,.35);font-size:26px;display:flex;align-items:center;justify-content:center;position:relative;color:#fff;margin-bottom:6px}
.yanBtn:active{transform:translateY(3px)}
.yanBtn small{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:800;color:#fff3d6;text-shadow:0 1px 3px #000;white-space:nowrap;font-family:var(--baslik)}
#insaBtn{position:relative;left:auto;bottom:auto;transform:none}
#insaBtn:active{transform:translateY(4px)}
#sipRozet{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;border-radius:11px;background:#d23c2c;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff3d6;padding:0 4px}
body.yerlestirme #altBar,body.panel #altBar,body.cekmece #altBar,body.ekim #altBar,body.ambarAcik #altBar,body.siparisAcik #altBar{transform:translateY(160%);transition:transform .2s}
#altBar{transition:transform .2s}
.alt{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(#f6ecd4,#e8d5aa);color:#4a3218;border-top:3px solid var(--altinK);border-radius:20px 20px 0 0;padding:14px 14px calc(var(--alt) + 14px);z-index:7;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1.1);box-shadow:0 -8px 24px rgba(0,0,0,.3);max-height:66vh;overflow-y:auto}
body.ekim #ekimPanel,body.ambarAcik #ambarPanel,body.siparisAcik #sipPanel{transform:none}
.alt .bas{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.alt h3{margin:0;font-family:var(--baslik);font-size:18px}
.alt .xBtn{background:#d9c49a;color:#4a3218}
#ekinler{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ekin{background:#fffaf0;border:2px solid #c9a868;border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;color:#4a3218;box-shadow:0 3px 0 #a8864c}
.ekin:active{transform:translateY(2px);box-shadow:0 1px 0 #a8864c}
.ekin .ei{font-size:30px}
.ekin b{font-size:13px}.ekin small{font-size:10.5px;opacity:.8}
.ekin.kilit{filter:grayscale(1);opacity:.6}
.ekimSec{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;font-weight:700}
.ekimSec input{width:20px;height:20px}
.urun{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid #d6c08e}
.urun .ui{font-size:28px;width:36px;text-align:center}
.urun .ua{flex:1;display:flex;flex-direction:column}
.urun .ua small{font-size:11.5px;opacity:.75}
.btn.kucuk{flex:0 0 auto;padding:8px 10px;font-size:13px;border-radius:11px}
.btn.tam{width:100%;margin-top:8px}
.bos{opacity:.7;text-align:center;padding:16px}
.sip{background:#fffaf0;border:2px solid #c9a868;border-radius:14px;padding:9px 10px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center}
.sip.tamam{border-color:#5aa83a;background:#f1fbe8}
.sip .sk{font-family:var(--baslik);font-weight:700;font-size:13px}
.sip .so{text-align:right;font-size:14px;display:flex;align-items:center;gap:3px;justify-content:flex-end}
.sip .so .xp{font-size:12px;opacity:.8;margin-left:4px}
.sip .si{display:flex;gap:10px;flex-wrap:wrap;font-weight:700;font-size:14px}
.sip .sd{display:flex;gap:6px;justify-content:flex-end}
.sip.bekle{display:block;text-align:center;opacity:.6;font-style:italic}
.hayvanlar{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.hv{background:#fffaf0;border:2px solid #d6c08e;border-radius:12px;padding:4px 8px;display:flex;flex-direction:column;align-items:center;min-width:62px}
.hv span{font-size:24px}.hv small{font-size:11px;font-weight:700}
.hv.ac{border-color:#e0a050}.hv.hazir{border-color:#5aa83a;background:#f1fbe8}
.tarifler{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.tarif{display:flex;align-items:center;gap:8px;background:#fffaf0;border:2px solid #d6c08e;border-radius:12px;padding:6px 8px}
.tarif .tu{display:flex;align-items:center;gap:4px;min-width:110px}
.tarif .tu small{font-size:11px;opacity:.75;margin-left:2px}
.tarif .tg{flex:1;display:flex;gap:6px;flex-wrap:wrap;font-size:13px;font-weight:700}
.tarif.kilit{opacity:.55}
.kuyruk{display:flex;gap:6px;margin-top:8px}
.slot{flex:1;height:54px;border-radius:12px;background:#fffaf0;border:2px solid #d6c08e;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;font-size:22px}
.slot small{font-size:10.5px;font-weight:700;z-index:1}
.slot .sb{position:absolute;left:0;bottom:0;height:4px;background:#5aa83a}
.slot.bos{border-style:dashed;opacity:.5}
.slot.hazir{border-color:#5aa83a;background:#f1fbe8}
.balon{position:absolute;left:0;top:0;width:40px;height:40px;border-radius:50% 50% 50% 8px;background:#fffaf0;border:2px solid #5aa83a;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 3px 8px rgba(0,0,0,.35);animation:zipla 1.2s ease-in-out infinite}
.balon sup{position:absolute;top:-6px;right:-6px;background:#d23c2c;color:#fff;font-size:11px;font-weight:800;border-radius:9px;padding:1px 5px}
.balon.ac{border-color:#e0a050;opacity:.85;animation:none;width:32px;height:32px;font-size:17px}
@keyframes zipla{50%{margin-top:-5px}}
.cubuk.ince{width:40px;height:7px;border-width:1.5px}
.kart .isci{position:absolute;top:4px;right:4px;font-size:12px;background:rgba(255,255,255,.8);border-radius:8px;padding:1px 4px}
.kart .engel{color:#a43a2a;font-size:10.5px}
.kart .km small{opacity:.7}
</style>
</head>
<body>
<canvas id="sahne"></canvas>
<div id="etiketler"></div>

<div id="ust">
  <div id="kaynaklar"></div>
  <button id="ayarBtn" aria-label="Ayarlar">⚙️</button>
</div>

<div id="altBar">
  <button class="yanBtn" id="sipBtn" aria-label="Siparişler">📜<span id="sipRozet" style="display:none"></span><small>Siparişler</small></button>
  <button id="insaBtn" aria-label="İnşa et"><svg viewBox="0 0 32 32"><rect x="14" y="12" width="4.5" height="17" rx="1.8" fill="#a86b3a" stroke="#3b2414" stroke-width="1.8"/><path d="M6 5 h18 a2.5 2.5 0 0 1 2.5 2.5 v4 a2.5 2.5 0 0 1 -2.5 2.5 h-18 l-3.5 -4.5 z" fill="#8d969e" stroke="#2a2f35" stroke-width="2" stroke-linejoin="round"/></svg>İNŞA</button>
  <button class="yanBtn" id="ambarBtn" aria-label="Ambar">📦<small>Ambar</small></button>
</div>

<div id="cekmece">
  <div class="bas"><h3>Ne inşa edelim?</h3><button class="xBtn" data-kapat aria-label="Kapat">✕</button></div>
  <div id="kartlar"></div>
</div>
